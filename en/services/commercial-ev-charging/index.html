function d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
async function unlock(pin){
  if(!(window.crypto&&crypto.subtle)){await new Promise(function(r){setTimeout(r,30);});return new TextDecoder().decode(window.__saranDecrypt(pin,d(P.s),d(P.i),P.n,d(P.c)));}
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pin,silent){
  var e=document.getElementById('err');
  if(!silent)e.textContent='Vérification…';
  try{var h=await unlock(pin);try{sessionStorage.setItem('saran-pin',pin);}catch(x){}
    document.open();document.write(h);document.close();}
  catch(x){if(!silent){e.textContent='NIP incorrect.';var i=document.getElementById('pin');i.value='';i.focus();}}
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('pin').value);});
try{var s=sessionStorage.getItem('saran-pin');if(s)go(s,true);}catch(x){}
